name: trusted-ci
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  trusted-ci:
    name: trusted-ci
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate trusted fixture mode
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -F '[red]' >/dev/null; then
            echo 'Deliberate qualification failure.'
            exit 1
          fi
          echo 'Trusted inert check passed without checking out candidate code.'
